
# ============================================================
# NOVAWATCH - Publication automatique du site
# Version : 0.3.1
#
# Correction :
# - Separation de la preparation et du deploiement.
# - Integration des fichiers PWA.
# - Verification de la presence des icones.
# ============================================================

name: NovaWatch - Pages Deployment


# ============================================================
# 1. DECLENCHEURS
# ============================================================

on:

  # Publication apres modification de la branche main.
  push:
    branches:
      - main

  # Publication apres execution du collecteur RSS.
  workflow_run:
    workflows:
      - "NovaWatch - RSS Collector"
    types:
      - completed
    branches:
      - main

  # Autorise une publication manuelle.
  workflow_dispatch:


# ============================================================
# 2. AUTORISATIONS
# ============================================================

permissions:

  # Lecture du contenu du depot.
  contents: read

  # Autorisation de publication sur GitHub Pages.
  pages: write

  # Authentification securisee via OpenID Connect.
  id-token: write


# ============================================================
# 3. GESTION DES EXECUTIONS SIMULTANEES
# ============================================================

concurrency:

  # Groupe commun a tous les deploiements NovaWatch.
  group: novawatch-pages

  # Ne pas interrompre une publication en cours.
  cancel-in-progress: false


# ============================================================
# 4. PREPARATION DU SITE - JOB BUILD
# ============================================================

jobs:

  build:

    name: Preparation de NovaWatch

    # Ne publie pas le site si le collecteur RSS a echoue.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    # Machine Linux temporaire fournie par GitHub.
    runs-on: ubuntu-latest

    # Duree maximale de la tache en minutes.
    timeout-minutes: 10

    steps:

      # Recuperation de la derniere version du depot.
      - name: Recuperation du depot
        uses: actions/checkout@v6

        with:

          # Recupere les fichiers de la branche main.
          ref: main


      # Configuration de GitHub Pages.
      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5


      # ======================================================
      # 5. PREPARATION DES FICHIERS
      # ======================================================

      - name: Preparation du site

        run: |
          # Creation du dossier temporaire.
          mkdir -p _site/data

          # Copie de la page principale.
          cp index.html _site/

          # Copie du CSS, du JavaScript et des icones.
          # -r : copie recursive des sous-dossiers.
          cp -r assets _site/

          # Copie des articles collectes.
          cp data/articles.json _site/data/

          # Copie de la configuration PWA.
          cp manifest.json _site/

          # Copie du gestionnaire de cache hors connexion.
          cp service-worker.js _site/


      # ======================================================
      # 6. VERIFICATION DES FICHIERS
      # ======================================================

      - name: Verification des ressources

        run: |
          # test -s verifie que le fichier existe
          # et que sa taille est superieure a zero.
          #
          # Si un fichier est absent, la tache echoue
          # avant de publier une application incomplete.

          test -s _site/index.html
          test -s _site/manifest.json
          test -s _site/service-worker.js
          test -s _site/data/articles.json
          test -s _site/assets/css/style.css
          test -s _site/assets/js/app.js
          test -s _site/assets/icons/icon-192.png
          test -s _site/assets/icons/icon-512.png
          test -s _site/assets/icons/icon-maskable.png
          test -s _site/assets/icons/apple-touch-icon.png
          test -s _site/assets/icons/favicon.png

          echo "Toutes les ressources sont presentes."


      # ======================================================
      # 7. CREATION DE L'ARTEFACT
      # ======================================================

      - name: Creation de l artefact
        uses: actions/upload-pages-artifact@v3

        with:

          # Nom attendu par GitHub Pages.
          name: github-pages

          # Dossier contenant les fichiers a publier.
          path: "_site"


  # ==========================================================
  # 8. PUBLICATION DU SITE - JOB DEPLOY
  # ==========================================================

  deploy:

    name: Publication de NovaWatch

    # IMPORTANT :
    # Attend la reussite complete du job build.
    # Le deploiement ne peut donc pas commencer
    # pendant la creation de l'artefact.
    needs: build

    runs-on: ubuntu-latest

    timeout-minutes: 10

    environment:

      # Environnement officiel GitHub Pages.
      name: github-pages

      # Adresse du site apres publication.
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploiement de NovaWatch

        # Identifiant permettant de recuperer
        # les informations du deploiement.
        id: deployment

        # Action officielle de publication.
        uses: actions/deploy-pages@v4

        with:

          # Artefact genere par le job build.
          artifact_name: github-pages
